<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music’All</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f7b7c5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Music’All">
<style>
:root{--bg:#f6f2ff;--card:#fff;--ink:#1e1544;--mut:#6f6896;--pri:#4b2a8f;--sun:#ffc043;--teal:#2bb3a3;--sec:#7c4dff;--pink:#ff5c8a;--ok:#2bb673;--ko:#ef476f;--line:#e5dcff;--sh:0 8px 24px rgba(75,42,143,.16)}
@media(prefers-color-scheme:dark){:root{--bg:#150f2b;--card:#211a42;--ink:#f1ecff;--mut:#aaa2d4;--pri:#7c4dff;--sec:#9a73ff;--line:#362c66;--sh:0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
#back{border:0;background:var(--card);color:var(--ink);width:42px;height:42px;border-radius:50%;font-size:1.5rem;box-shadow:var(--sh);cursor:pointer;visibility:hidden;flex:none}
#logo{flex:1;margin:0;text-align:center;font-size:clamp(1.3rem,6vw,1.9rem);font-weight:900;white-space:nowrap;cursor:pointer;background:linear-gradient(90deg,var(--pri),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-color-scheme:dark){#logo{background:linear-gradient(90deg,#b79cff,#ff8fb0);-webkit-background-clip:text;background-clip:text}}
#score{background:var(--sun);color:#3b2a00;font-weight:900;padding:8px 13px;border-radius:99px;box-shadow:var(--sh);flex:none;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:6px 16px}
h2{margin:20px 0 10px;font-size:1.25rem}
.hero-card{background:linear-gradient(135deg,var(--pri),var(--pink));color:#fff;border-radius:28px;padding:20px;box-shadow:var(--sh);display:flex;gap:16px;align-items:center;margin:8px 0 6px}
.hero-card h3{margin:0;font-size:1.25rem}.hero-card p{margin:2px 0 0;opacity:.95}
.btn{border:0;border-radius:18px;padding:15px 20px;font:inherit;font-weight:800;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:var(--sh);transition:transform .12s}
.btn:active{transform:scale(.97)}
.main{background:var(--pri);color:#fff;width:100%;margin-top:12px;font-size:1.05rem}
.alt{background:var(--sec);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lv{color:#fff;text-align:center;padding:22px 16px;border-radius:26px;background:linear-gradient(135deg,var(--c),var(--c2));font-size:1.7rem;font-weight:900}
.lv small{display:block;font-size:.85rem;font-weight:700;opacity:.92;margin-top:4px}
.axe{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:12px;padding:12px 16px}
.axe .t{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;flex:none}
.axe b{display:block}.axe small{color:var(--mut);font-weight:700;display:block}
.card{background:var(--card);border-radius:24px;padding:18px;margin:12px 0;box-shadow:var(--sh)}
.card h3{margin:0 0 8px}.card p{margin:8px 0}
.lesson{border-top:6px solid var(--sec)}
.retain{border-top:6px solid var(--sun);background:color-mix(in srgb,var(--sun) 14%,var(--card))}
.retain li{list-style:none;margin:8px 0;padding-left:30px;position:relative}
.retain li::before{content:"♪";position:absolute;left:4px;color:var(--pink);font-weight:900}
.seg{display:flex;background:var(--line);border-radius:18px;padding:4px;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:11px;border-radius:14px;font:inherit;font-weight:800;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.tr{color:var(--mut);font-size:.92rem;margin:4px 0 8px}
.q{font-size:1.1rem}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:15px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.opt.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 20%,var(--card))}
input[type=text],select{font:inherit;padding:14px;border-radius:16px;border:2px solid var(--line);width:100%;margin:8px 0;background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;min-height:44px;padding:6px;border-radius:16px}
.zone{border:2px dashed var(--line)}
.chip{background:var(--sec);color:#fff;padding:10px 15px;border-radius:99px;border:0;font:inherit;font-weight:700;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.chip.sel{outline:3px solid var(--sun)}.chip.off{background:var(--line);color:var(--mut)}
.msg{font-weight:800;margin-top:10px}.msg.ok{color:var(--ok)}.msg.ko{color:var(--ko)}
.say{background:none;border:0;font:inherit;color:var(--sec);font-weight:800;cursor:pointer;padding:6px 0}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--pink));border-radius:9px;transition:width .4s}
.big{text-align:center}.big .em{font-size:3.6rem}
.gift{background:color-mix(in srgb,var(--sun) 25%,var(--card));border-radius:16px;padding:10px;margin:10px 0;font-weight:800}
.ex{max-width:760px;margin-left:auto;margin-right:auto}
.av{position:relative;width:1.6em;height:1.6em;display:inline-grid;place-items:center;border-radius:50%;flex:none}
.av .b{font-size:1em;line-height:1}.av img.b{width:100%;height:100%;object-fit:contain}
.av .hat{position:absolute;top:-.3em;left:50%;transform:translateX(-50%);font-size:.55em;line-height:1}
.av .fc{position:absolute;top:.52em;left:50%;transform:translateX(-50%);font-size:.42em;line-height:1}
.av .hd{position:absolute;right:-.25em;bottom:.05em;font-size:.55em;line-height:1}
.av .pt{position:absolute;left:-.3em;bottom:0;font-size:.55em;line-height:1}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.it{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 4px;font-size:1.8rem;text-align:center;cursor:pointer;color:var(--ink);font-family:inherit}
.it small{display:block;font-size:.68rem;font-weight:700;color:var(--mut);line-height:1.1;margin-top:4px}
.it.on{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 14%,var(--card))}
.it.lock{opacity:.55;filter:grayscale(1)}
.it i{display:block;width:32px;height:32px;border-radius:50%;margin:0 auto;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.road{display:flex;flex-direction:column-reverse;position:relative;padding:14px 0;margin:10px 0}
.road::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:18px;margin-left:-9px;border-radius:9px;background:repeating-linear-gradient(180deg,#fff9 0 10px,transparent 10px 24px),#c9bbea}
.stop{display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;margin:16px 0;position:relative}
.nw{grid-column:2;grid-row:1;display:flex;justify-content:center;position:relative}
.node{width:70px;height:70px;border-radius:50%;border:5px solid #fff;font-size:1.9rem;background:#c9bbea;box-shadow:var(--sh);cursor:pointer}
.node.done{background:var(--sun)}.node.cur{background:var(--pink);animation:pulse 1.4s infinite}.node.lock{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.lab{padding:0 10px;font-weight:900}.lab small{display:block;color:var(--mut);font-weight:700}
.stop.r .lab{grid-column:3;grid-row:1}.stop.l .lab{grid-column:1;grid-row:1;text-align:right}
.hero{position:absolute;top:-56px;left:50%;margin-left:-29px;animation:bob 1s infinite;pointer-events:none;z-index:2}
.hero.walk{animation:walk 1s ease-out,bob 1s 1s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes walk{from{transform:translateY(120px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,92,138,.28)}}
/* frise */
.tl{overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px}
.tli{display:flex;gap:12px;width:max-content;position:relative;padding:50px 10px 10px}
.tli::before{content:"";position:absolute;left:0;right:0;top:36px;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--sec),var(--pink))}
.ti{width:158px;flex:none;position:relative;cursor:pointer;text-align:center;scroll-snap-align:center}
.ti .dt{position:absolute;top:-40px;left:-6px;right:-6px;font-weight:900;font-size:.74rem;color:var(--pri)}
.ti i{position:absolute;top:-20px;left:50%;margin-left:-10px;width:20px;height:20px;border-radius:50%;background:var(--c);border:4px solid var(--bg)}
.ti .tc{background:var(--card);border-radius:18px;padding:12px 8px;box-shadow:var(--sh);border-top:6px solid var(--c);min-height:104px}
.ti.on .tc{outline:3px solid var(--sun)}
.ti .tc div{font-size:1.9rem}.ti .tc b{display:block;font-size:.85rem;line-height:1.2}
.arrows{display:flex;gap:10px;justify-content:flex-end}.arrows button{width:48px;padding:8px}
/* piano & batterie */
.piano{position:relative;display:flex;height:190px;margin:10px 0;user-select:none;-webkit-user-select:none;touch-action:none}
.wk{flex:1;background:#fff;border:1px solid #b9b0d0;border-radius:0 0 8px 8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:.7rem;color:#5a5278;font-weight:800}
.wk.on{background:#d9c8ff}.wk.tg{box-shadow:inset 0 -16px 0 var(--sun)}
.bk{position:absolute;top:0;width:4.3%;height:62%;background:#241a4a;border-radius:0 0 6px 6px;z-index:2}
.bk.on{background:var(--sec)}.bk.tg{box-shadow:0 0 0 4px var(--sun)}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad{aspect-ratio:1.25;border:0;border-radius:18px;font:inherit;font-weight:800;color:#fff;font-size:.95rem;cursor:pointer;touch-action:manipulation;box-shadow:var(--sh)}
.pad:active{transform:scale(.94)}
.sq{display:grid;grid-template-columns:62px repeat(8,1fr);gap:4px;align-items:center}
.sq b{font-size:.72rem}.sc{aspect-ratio:1;border:0;border-radius:8px;background:var(--line);cursor:pointer;padding:0}
.sc.on{background:var(--sec)}.sc.cur{outline:3px solid var(--sun)}
/* mots croisés / mêlés */
.xw{display:grid;gap:2px;justify-content:center;margin:10px auto}
.xc{position:relative;width:var(--cs);height:var(--cs)}.xc.b{visibility:hidden}
.xc input{width:100%;height:100%;text-align:center;text-transform:uppercase;font:inherit;font-weight:800;padding:0;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:calc(var(--cs)*.55)}
.xc small{position:absolute;top:1px;left:3px;font-size:.55rem;font-weight:800;color:var(--sec);pointer-events:none}
.xc.ko input{background:color-mix(in srgb,var(--ko) 25%,var(--card))}.xc.ok input{background:color-mix(in srgb,var(--ok) 25%,var(--card))}
.cl li{margin:6px 0}
.ws{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:380px;margin:10px auto;user-select:none}
.wc{aspect-ratio:1;border:0;border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-weight:800;box-shadow:var(--sh);cursor:pointer;font-size:1rem;padding:0}
.wc.s{background:var(--sun);color:#3b2a00}.wc.f{background:var(--sec);color:#fff}
.wl{display:flex;flex-wrap:wrap;gap:6px}.wl span{padding:4px 10px;border-radius:99px;background:var(--line);font-weight:700;font-size:.85rem}.wl span.f{text-decoration:line-through;opacity:.5}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}.kbk{margin:0;padding:10px 0;text-align:center}.kbk:disabled{opacity:.55}
.dz{display:flex;align-items:center;gap:10px;margin:8px 0}.dz b{flex:1;font-size:.9rem}
.slot{flex:1;min-height:52px;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:4px}
.slot.ok{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.slot.ko{border:2px solid var(--ko);background:color-mix(in srgb,var(--ko) 18%,var(--card))}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.mc{min-height:82px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--sec),var(--pink));color:#fff;font:inherit;font-weight:800;font-size:1.4rem;cursor:pointer;padding:6px}
.mc.up{background:var(--card);color:var(--ink);box-shadow:var(--sh);font-size:.78rem}.mc.done{background:color-mix(in srgb,var(--ok) 25%,var(--card));color:var(--ink);font-size:.78rem}
#toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:560px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;z-index:50;transition:opacity .3s;opacity:0;pointer-events:none;text-align:center;font-weight:700}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
#tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:1.45rem;display:flex;flex-direction:column;align-items:center;padding:5px 2px;border-radius:16px;cursor:pointer;line-height:1.2}
#tabs button span{font-size:.66rem;font-weight:800}
#tabs button.on{color:var(--pink);background:color-mix(in srgb,var(--pink) 13%,transparent)}
footer{max-width:640px;margin:18px auto 0;padding:0 16px;text-align:center;color:var(--mut);font-size:.8rem}
footer a{color:var(--sec);font-weight:800;text-decoration:underline;cursor:pointer}
#vw{margin-top:8px}#vw a{margin:0 4px;text-decoration:none;opacity:.7;cursor:pointer;color:var(--mut)}#vw a.on{opacity:1;color:var(--pri);text-decoration:underline}
body.desk{padding-left:112px;padding-bottom:30px;font-size:17px}
body.desk header{padding-left:20px;padding-right:28px}
body.desk #tabs{top:0;bottom:0;right:auto;width:112px;flex-direction:column;justify-content:flex-start;gap:10px;padding:24px 10px;box-shadow:6px 0 20px rgba(0,0,0,.06)}
body.desk #tabs button{flex:none;padding:12px 4px}
body.desk main,body.desk footer{max-width:1000px}
body.desk main{padding:10px 28px}
body.desk .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
body.desk .road{max-width:620px;margin:10px auto}
body.desk .kb{grid-template-columns:repeat(13,1fr)}
body.desk .mem{grid-template-columns:repeat(4,1fr)}
body.desk .piano{height:240px}
body.desk .btn:hover,body.desk .opt:hover,body.desk .it:hover{transform:translateY(-2px)}
body.desk #toast{left:132px}

:root{--bg:#f7b7c5;--card:#fff;--ink:#2b1230;--mut:#7a6072;--pri:#8a1553;--sun:#ffc043;--sec:#0d7c8a;--pink:#ff5c8a;--ok:#2bb673;--ko:#ef476f;--line:#f8dbe8;--sh:0 8px 22px rgba(150,40,80,.2);--rb:#ea5a0c;--on:#4a0b2e}
body{background:linear-gradient(165deg,#fcd5dd 0%,#f7b7c5 50%,#f4a6b8 100%) fixed;color:var(--on)}
header{background:color-mix(in srgb,#f9c3cf 85%,transparent);padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px}
#ttl{flex:1;text-align:center;line-height:1.05;cursor:pointer;min-width:0}
#logo{margin:0;font-family:"MATitle",ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;font-style:italic;font-weight:900;font-size:clamp(1.9rem,9vw,3rem);letter-spacing:0;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#f0398a;-webkit-text-fill-color:#f0398a;text-shadow:0 3px 0 #fff;flex:none}
#sub{font-size:.76rem;font-weight:800;color:var(--on);margin-top:3px;letter-spacing:.3px}
h2{color:var(--on)}
.card{color:var(--ink)}.gift{color:#3b2a00}.ti .tc{color:var(--ink)}
.tr{color:var(--on)}.card .tr,.gift .tr{color:var(--mut)}
.msg.ok{color:#0a5a34}.msg.ko{color:#8c0730}.card .msg.ok{color:var(--ok)}.card .msg.ko{color:var(--ko)}
.wl span{color:var(--ink)}.lab small{color:#6b1241}.say{color:var(--on)}
.ti .dt{color:var(--on)}.ti i{border-color:#f7b7c5}
footer{color:var(--on)}footer a{color:var(--on)}#vw a{color:var(--on)}#vw a.on{color:var(--on);opacity:1;font-weight:800}
#toast{color:#fff}
.hero-card{background:linear-gradient(135deg,#ff9a3d,#ea5a0c)}
.main{background:var(--rb)}
.alt{background:#fff;color:var(--rb);box-shadow:inset 0 0 0 2px var(--rb),var(--sh)}
.chip{background:var(--rb)}.chip.off{background:#fff;color:var(--ink)}
.lesson{border-top-color:var(--rb)}.retain li::before{color:var(--rb)}
.bar i{background:linear-gradient(90deg,var(--sun),var(--rb))}
.road::before{background:repeating-linear-gradient(180deg,#fff9 0 10px,transparent 10px 24px),#fde6ec}
.node{background:#fff1f5}.node.cur{background:var(--rb)}.node.done{background:color-mix(in srgb,var(--rb) 45%,white)}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(234,90,12,.3)}}
.it.on{border-color:var(--rb)}
.mc{background:linear-gradient(135deg,var(--rb),color-mix(in srgb,var(--rb) 55%,white))}
.wc.f,.sc.on{background:var(--rb)}.wk.on{background:#ffd0e3}
#tabs{gap:2px;padding-left:4px;padding-right:4px}
#tabs button{min-width:0;font-size:1.3rem;padding:5px 0}
#tabs button span{font-size:.6rem;white-space:nowrap}
#tabs s{text-decoration:none}#tabs i{font-style:normal;display:none}

.colo{padding:8px}.colo svg{display:block;width:100%;max-width:460px;margin:auto;touch-action:manipulation;border-radius:16px}

.cn{font:700 12px system-ui,sans-serif;fill:#5b5568;text-anchor:middle;dominant-baseline:central;pointer-events:none}

.stats div{background:var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:1.2rem}.stats small{color:var(--mut);font-weight:700;font-size:.72rem;line-height:1.2;display:block}
.bl{padding:7px 0;border-top:1px solid var(--line);font-weight:700;font-size:.92rem}.bl small{display:block;color:var(--mut);font-weight:700;padding-left:26px}
.code{font:.8rem ui-monospace,Menlo,Consolas,monospace;width:100%;border-radius:12px;border:2px solid var(--line);padding:10px;word-break:break-all;resize:none;background:#fff;color:var(--ink);margin:6px 0}

const LV=["6ème","5ème","4ème","3ème"],CO=[["#7c4dff","#4b2a8f"],["#ff5c8a","#d6336c"],["#ff9f43","#f76707"],["#2bb3a3","#0b7285"]];
// Thème = [emoji, titre, leçon, à retenir (|), définitions "terme=définition;…", QCM [q,"a|b|c",index,explication], Vrai/Faux [énoncé,1|0,explication], Trous [phrase,réponse(s),explication], exercices sonores "h,s,m,i"]
const D=[[
["🔊","Le son et ses paramètres","Un <b>son</b> est une vibration qui se propage dans l'air. On le décrit avec quatre paramètres : la <b>hauteur</b> (grave ou aigu, selon la fréquence en hertz), la <b>durée</b> (court ou long), l'<b>intensité</b> (fort ou doux, mesurée en décibels) et le <b>timbre</b>, la « couleur » du son qui permet de reconnaître un instrument ou une voix.<br>Un <b>bruit</b> est un son sans hauteur précise. Le <b>silence</b>, l'absence de son, fait aussi partie de la musique.","4 paramètres : hauteur, durée, intensité, timbre|Hauteur : grave ↔ aigu (fréquence en hertz)|Intensité : se mesure en décibels (dB)|Timbre : reconnaître l'instrument ou la voix|Le silence fait partie de la musique","hauteur=Un son est grave ou aigu;durée=Un son est court ou long;intensité=Un son est fort ou doux;timbre=La couleur d'un son, propre à chaque instrument;décibel=Unité qui mesure l'intensité d'un son;silence=Absence de son, qui fait partie de la musique",[["Quel paramètre permet de reconnaître un violon d'une flûte ?","la hauteur|le timbre|la durée",1,"Le timbre est la « couleur » du son."],["Un son très aigu est…","un son de haute fréquence|un son fort|un son long",0,"Plus la fréquence est élevée, plus le son est aigu."],["L'intensité d'un son se mesure en…","hertz|décibels|mètres",1,"Le hertz mesure la fréquence ; le décibel, l'intensité."]],[["Le silence fait partie de la musique.",1,"Les silences structurent le rythme."],["Un son aigu est un son de faible fréquence.",0,"Un son aigu a une fréquence élevée."]],[["Le ___ est la couleur d'un son, propre à chaque instrument.","timbre","timbre"],["La hauteur d'un son dépend de sa ___ (en hertz).","fréquence","fréquence"]],"h"],
["🥁","Pulsation, rythme et mesure","La <b>pulsation</b> est le battement régulier de la musique, comme les pas d'une marche. Le <b>rythme</b> est la manière dont les sons longs et courts sont organisés dans le temps. Le <b>tempo</b> est la vitesse de la pulsation, en battements par minute (BPM).<br>La <b>mesure</b> regroupe les pulsations : à 4 temps (4/4) ou à 3 temps (valse, 3/4). Les valeurs de notes : la <b>ronde</b> dure 4 temps, la <b>blanche</b> 2 temps, la <b>noire</b> 1 temps, la <b>croche</b> ½ temps.","Pulsation = battement régulier|Rythme = organisation des durées|Tempo = vitesse (en BPM)|Ronde 4 temps · blanche 2 · noire 1 · croche ½|Une valse est à 3 temps","pulsation=Battement régulier de la musique;rythme=Organisation des sons longs et courts dans le temps;tempo=Vitesse de la pulsation;mesure=Groupe de temps séparé par des barres;ronde=Note qui dure 4 temps;noire=Note qui dure 1 temps",[["Combien de temps dure une blanche ?","1 temps|2 temps|4 temps",1,"Ronde 4 · blanche 2 · noire 1 · croche ½."],["Une valse se compte généralement à…","2 temps|3 temps|5 temps",1,"Mesure à 3 temps (3/4)."],["BPM veut dire…","battements par minute|bruits par morceau|basses par mesure",0,"Le tempo se mesure en battements par minute."]],[["La croche dure plus longtemps que la noire.",0,"La croche dure ½ temps, la noire 1 temps."],["Le tempo est la vitesse de la pulsation.",1,"Plus il est rapide, plus les pulsations sont rapprochées."]],[["La note qui dure 4 temps s'appelle la ___ .","ronde","La ronde dure 4 temps."],["Le ___ est la vitesse de la pulsation.","tempo","Le tempo se mesure en BPM."]],""],
["🎼","Lire la musique : notes et portée","Les notes s'écrivent sur une <b>portée</b> de 5 lignes. La <b>clé de sol</b>, placée au début, indique où se trouve le sol. Les 7 notes se nomment <b>do, ré, mi, fa, sol, la, si</b> (en anglais C, D, E, F, G, A, B) : plus la note est haute sur la portée, plus elle est aiguë.<br>En clé de sol, la 1re ligne (en bas) est un <b>mi</b>. Un <b>dièse (♯)</b> monte une note d'un demi-ton, un <b>bémol (♭)</b> la descend.","Portée = 5 lignes · clé de sol|do ré mi fa sol la si (C D E F G A B)|1re ligne en clé de sol = mi|Dièse ♯ monte d'un demi-ton · bémol ♭ le descend|Plus la note est haute, plus le son est aigu","portée=Les 5 lignes sur lesquelles s'écrivent les notes;clé de sol=Signe qui indique la place du sol sur la portée;dièse=Signe qui monte une note d'un demi-ton;bémol=Signe qui descend une note d'un demi-ton;demi-ton=Plus petit écart entre deux notes du piano;gamme=Suite de notes rangées de la plus grave à la plus aiguë",[["Combien de lignes compte une portée ?","4|5|7",1,"Une portée a 5 lignes."],["Quelle note se nomme « C » en anglais ?","do|sol|la",0,"C = do, D = ré, E = mi, F = fa, G = sol, A = la, B = si."],["Un bémol…","monte la note d'un demi-ton|descend la note d'un demi-ton|rend la note plus longue",1,"♭ descend, ♯ monte."]],[["La clé de sol est placée au début de la portée.",1,"Elle indique la position de la note sol."],["Il y a 8 notes différentes dans la gamme de do.",0,"Il y en a 7 : do ré mi fa sol la si."]],[["Les notes s'écrivent sur une ___ de cinq lignes.","portée","portée"],["La note qui suit « sol » est le ___ .","la","sol → la"]],"s"],
["🎤","La voix et le chant","La voix est un instrument : le son naît de la vibration des <b>cordes vocales</b>. Les voix se classent par hauteur : chez les femmes <b>soprano</b> (aiguë), <b>mezzo-soprano</b>, <b>alto</b> (grave) ; chez les hommes <b>ténor</b> (aigu), <b>baryton</b>, <b>basse</b> (grave).<br>On chante en <b>chœur</b> (groupe), en <b>canon</b> (même mélodie décalée), <b>a cappella</b> (sans instrument) ou en <b>solo</b>.","Femmes : soprano · mezzo · alto|Hommes : ténor · baryton · basse|Chœur = groupe de chanteurs|A cappella = sans instrument|Canon = même mélodie qui commence en décalé","soprano=Voix de femme la plus aiguë;alto=Voix de femme la plus grave;ténor=Voix d'homme aiguë;basse=Voix d'homme la plus grave;chœur=Groupe de chanteurs;canon=Même mélodie chantée en décalé",[["Quelle voix d'homme est la plus grave ?","ténor|baryton|basse",2,"Du plus aigu au plus grave : ténor, baryton, basse."],["Chanter « a cappella », c'est chanter…","sans instrument|très fort|en canon",0,"A cappella = sans accompagnement instrumental."],["Qu'est-ce qui produit le son de la voix ?","les cordes vocales|la langue|les dents",0,"Elles vibrent quand l'air passe."]],[["Le soprano est une voix d'homme.",0,"C'est la voix de femme la plus aiguë."],["Dans un canon, la même mélodie est chantée en décalé.",1,"Chaque groupe commence l'un après l'autre."]],[["Un groupe de chanteurs s'appelle un ___ .","chœur","chœur"],["La voix de femme la plus aiguë est la ___ .","soprano","soprano"]],"h"],
["🎻","Les familles d'instruments","Les instruments se rangent en familles selon la façon dont ils produisent le son : les <b>cordes</b> (frottées : violon ; pincées : guitare, harpe), les <b>vents</b> (<b>bois</b> : flûte, clarinette, hautbois ; <b>cuivres</b> : trompette, trombone, cor), les <b>percussions</b> (tambour, xylophone), les <b>claviers</b> (piano, orgue) et les instruments <b>électroniques</b> (synthétiseur).","Cordes : frottées, pincées ou frappées|Vents : bois (flûte, clarinette) · cuivres (trompette, trombone)|Percussions : on frappe ou on secoue|Claviers : piano, orgue|Électronique : synthétiseur","cordes=Famille du violon, de la guitare et de la harpe;bois=Famille de la flûte et de la clarinette;cuivres=Famille de la trompette et du trombone;percussions=Instruments que l'on frappe ou que l'on secoue;clavier=Instrument à touches comme le piano;synthétiseur=Instrument électronique qui crée des sons",[["La trompette appartient à la famille…","des bois|des cuivres|des cordes",1,"Trompette, trombone et cor sont des cuivres."],["Le violoncelle est un instrument à…","cordes frottées|vent|percussion",0,"On le joue avec un archet."],["Le xylophone appartient aux…","percussions|cuivres|cordes",0,"On le frappe avec des maillets."]],[["La flûte traversière est un cuivre.",0,"C'est un instrument de la famille des bois."],["Le piano a des touches : c'est un clavier.",1,"Ses sons viennent de cordes frappées par des marteaux."]],[["La clarinette fait partie de la famille des ___ .","bois","bois"],["Le tambour est une ___ .","percussion","percussion"]],""]

["🎚️","Nuances, tempo et caractère","Pour interpréter une musique, le compositeur indique des <b>nuances</b> : <b>p</b> piano (doux), <b>f</b> forte (fort), <b>pp</b> pianissimo (très doux), <b>ff</b> fortissimo (très fort), <b>crescendo</b> (de plus en plus fort) et <b>decrescendo</b>.<br>Il précise aussi le <b>tempo</b> : <b>adagio</b> (lent), <b>andante</b> (modéré), <b>allegro</b> (rapide), <b>presto</b> (très rapide). Ces mots viennent de l'italien.","p = doux · f = fort · pp / ff = très|Crescendo = de plus en plus fort|Adagio lent · andante modéré · allegro rapide · presto très rapide|Ces termes sont en italien|Le caractère change l'émotion de l'œuvre","piano=Nuance : jouer doucement;forte=Nuance : jouer fort;crescendo=De plus en plus fort;adagio=Tempo lent;allegro=Tempo rapide;presto=Tempo très rapide",[["« ff » signifie…","très doux|fortissimo (très fort)|de plus en plus fort",1,"ff = fortissimo."],["Quel mot indique un tempo lent ?","presto|allegro|adagio",2,"Adagio = lent."],["Un crescendo, c'est…","de plus en plus doux|de plus en plus fort|de plus en plus lent",1,"Le contraire est decrescendo."]],[["Le mot « piano » désigne aussi une nuance douce.",1,"p = piano = doucement."],["Presto indique un tempo lent.",0,"Presto = très rapide."]],[["Pour jouer très doucement, on écrit ___ (pp).","pianissimo","pianissimo"],["Un tempo rapide se dit ___ .","allegro|presto","allegro (presto, plus rapide encore)"]],""],
["🏛️","L'orchestre et les formations","L'<b>orchestre symphonique</b> réunit une centaine de musiciens en familles (cordes, bois, cuivres, percussions) sous la direction du <b>chef d'orchestre</b>. Il joue des <b>symphonies</b> et des <b>concertos</b> (un soliste avec l'orchestre).<br>Il existe des formations plus petites : le <b>duo</b>, le <b>trio</b>, le <b>quatuor à cordes</b> (2 violons, 1 alto, 1 violoncelle), le <b>big band</b> (jazz). Le <b>diapason</b> donne le « la » pour accorder les instruments.","Orchestre = cordes, bois, cuivres, percussions|Le chef d'orchestre dirige|Quatuor à cordes : 2 violons, alto, violoncelle|Concerto = soliste + orchestre|Le « la » sert à accorder","orchestre=Grand groupe de musiciens dirigé par un chef;chef d'orchestre=Personne qui dirige les musiciens;symphonie=Grande œuvre pour orchestre;concerto=Œuvre pour un soliste et un orchestre;quatuor=Formation de quatre musiciens;diapason=Donne le « la » pour accorder",[["Combien d'instruments compte un quatuor à cordes ?","3|4|5",1,"2 violons, 1 alto, 1 violoncelle."],["Qui dirige l'orchestre ?","le soliste|le chef d'orchestre|le compositeur",1,"Le chef coordonne les musiciens."],["Dans un concerto, il y a…","un soliste et un orchestre|seulement des voix|uniquement des percussions",0,"Le soliste dialogue avec l'orchestre."]],[["Le violoncelle fait partie d'un quatuor à cordes.",1,"Avec deux violons et un alto."],["Les cuivres sont la famille la plus nombreuse de l'orchestre symphonique.",0,"Ce sont les cordes."]],[["Le ___ dirige l'orchestre.","chef|chef d'orchestre","le chef d'orchestre"],["Une œuvre pour un soliste et un orchestre est un ___ .","concerto","concerto"]],""],
["🎹","Mélodie, accompagnement et harmonie","Une chanson associe souvent une <b>mélodie</b> (la suite de notes qu'on chante) et un <b>accompagnement</b> (accords, basse, rythme). Plusieurs notes jouées en même temps forment un <b>accord</b> ; l'<b>harmonie</b> est l'art d'enchaîner les accords.<br>Un accord <b>majeur</b> sonne souvent joyeux, un accord <b>mineur</b> plus triste ou sombre. La <b>tonalité</b> est la famille de notes qui organise un morceau. La <b>polyphonie</b> superpose plusieurs mélodies.","Mélodie = notes qui se suivent (on la chante)|Accompagnement = accords, basse, rythme|Accord = plusieurs notes en même temps|Majeur ≈ joyeux · mineur ≈ triste|Polyphonie = plusieurs mélodies superposées","mélodie=Suite de notes que l'on peut chanter;accord=Plusieurs notes jouées en même temps;harmonie=Art d'enchaîner les accords;accompagnement=Ce qui soutient la mélodie;tonalité=Famille de notes qui organise un morceau;polyphonie=Plusieurs mélodies superposées",[["Un accord est…","une seule note|plusieurs notes jouées ensemble|un silence",1,"Au moins trois notes pour un accord classique."],["Un accord mineur sonne plutôt…","joyeux|triste ou sombre|très fort",1,"Le majeur est souvent perçu comme joyeux."],["La mélodie, c'est…","la suite de notes qu'on peut chanter|le rythme de la batterie|le volume",0,"C'est « l'air » de la chanson."]],[["L'accompagnement soutient la mélodie.",1,"Il peut être joué à la guitare, au piano…"],["Un accord se joue toujours avec une seule note.",0,"Il faut plusieurs notes simultanées."]],[["Plusieurs notes jouées en même temps forment un ___ .","accord","accord"],["L'air d'une chanson s'appelle la ___ .","mélodie","mélodie"]],"m,i"],
["🌍","Musiques du monde et traditions","Chaque région du monde a ses musiques, ses instruments et ses danses : le <b>flamenco</b> (Espagne), le <b>fado</b> (Portugal), le <b>gamelan</b> (Indonésie, percussions en métal), le <b>sitar</b> (Inde), la <b>kora</b> (Afrique de l'Ouest), les <b>taiko</b> (Japon), la <b>samba</b> (Brésil), les musiques <b>celtiques</b> (Irlande, Bretagne).<br>Ces musiques se transmettent souvent à l'oreille, de génération en génération : c'est la <b>tradition orale</b>.","Musique traditionnelle = transmise oralement|Flamenco : Espagne · Fado : Portugal|Sitar : Inde · Kora : Afrique de l'Ouest · Gamelan : Indonésie|Samba : Brésil · Taiko : Japon|Les cultures se mélangent : c'est la fusion","flamenco=Musique espagnole avec guitare, chant et danse;fado=Chant mélancolique du Portugal;gamelan=Orchestre de percussions d'Indonésie;sitar=Instrument à cordes de l'Inde;kora=Harpe-luth d'Afrique de l'Ouest;samba=Musique et danse du Brésil",[["Le fado est une musique du…","Portugal|Japon|Brésil",0,"Fado signifie « destin »."],["Le sitar est un instrument…","d'Inde|d'Écosse|du Mexique",0,"Popularisé par Ravi Shankar."],["La tradition orale, c'est…","transmettre à l'oreille|écrire sur partition|enregistrer en studio",0,"On apprend en écoutant et en répétant."]],[["Le gamelan est un orchestre de percussions d'Indonésie.",1,"Gongs et métallophones."],["La kora vient d'Asie.",0,"Elle vient d'Afrique de l'Ouest."]],[["La ___ est une musique et une danse du Brésil.","samba","samba"],["Le ___ est un chant mélancolique du Portugal.","fado","fado"]],""],
["🏰","Du Moyen Âge au baroque","La musique occidentale s'écrit depuis le <b>Moyen Âge</b> (chant <b>grégorien</b>, chanté à l'église par une seule voix). À la <b>Renaissance</b>, la <b>polyphonie</b> se développe (Josquin des Prés) et l'imprimerie diffuse les partitions. Le <b>baroque</b> (1600-1750) invente l'<b>opéra</b> (Monteverdi) ; Vivaldi, Bach et Haendel en sont les grands noms. Le <b>clavecin</b> et l'<b>orgue</b> sont typiques de l'époque.","Moyen Âge : chant grégorien (une seule voix)|Renaissance : polyphonie, imprimerie|Baroque (1600-1750) : opéra, clavecin, orgue|Compositeurs : Josquin, Monteverdi, Vivaldi, Bach, Haendel|Ordre : Moyen Âge → Renaissance → baroque","grégorien=Chant religieux à une seule voix, sans instrument;polyphonie=Plusieurs voix qui chantent des mélodies différentes;baroque=Époque de Vivaldi et Bach (1600-1750);clavecin=Instrument à clavier aux cordes pincées;opéra=Spectacle chanté avec orchestre et décors;Moyen Âge=Époque du chant grégorien",[["Qui a composé « Les Quatre Saisons » ?","Mozart|Vivaldi|Chopin",1,"Vivaldi, compositeur baroque italien."],["Le chant grégorien est chanté…","à une seule voix|à quatre voix|avec un orchestre",0,"C'est une monodie."],["Quelle époque vient en premier ?","baroque|Moyen Âge|classicisme",1,"Moyen Âge, Renaissance, baroque, classicisme…"]],[["J.-S. Bach est un compositeur baroque.",1,"Il est né en 1685."],["Le clavecin est un instrument du XXe siècle.",0,"Il est typique de la Renaissance et du baroque."]],[["Le chant ___ est le chant religieux du Moyen Âge.","grégorien","grégorien"],["L'époque de Vivaldi et de Bach s'appelle le ___ .","baroque","baroque"]],""]

["🎹","Classicisme et romantisme","Le <b>classicisme</b> (vers 1750-1810) recherche l'équilibre, la clarté et des formes précises : Haydn, Mozart, Beethoven. Le piano remplace peu à peu le clavecin. Le <b>romantisme</b> (XIXe siècle) privilégie l'expression des sentiments et la liberté : Schubert, Chopin, Liszt, Berlioz, Wagner, Tchaïkovski.<br>On écrit des <b>lieder</b>, des <b>nocturnes</b>, des <b>poèmes symphoniques</b> et de grands <b>opéras</b>.","Classicisme : équilibre, clarté (Haydn, Mozart)|Romantisme : sentiments, liberté (Chopin, Schubert, Berlioz)|Beethoven fait le lien entre les deux|Le piano devient l'instrument roi|L'orchestre s'agrandit au XIXe siècle","classicisme=Style d'équilibre et de clarté (Mozart);romantisme=Style qui exprime les sentiments (Chopin);Mozart=Compositeur classique autrichien (1756-1791);Beethoven=Compositeur né à Bonn, devenu sourd;lied=Chant avec piano en langue allemande;nocturne=Pièce romantique de piano, calme et rêveuse",[["Quel compositeur est un grand romantique du piano ?","Chopin|Vivaldi|Monteverdi",0,"Frédéric Chopin (1810-1849)."],["Mozart est un compositeur…","baroque|classique|romantique",1,"Né à Salzbourg en 1756."],["Quelle caractéristique est romantique ?","l'expression des sentiments|la recherche d'un équilibre parfait|la musique sans instruments",0,"Le romantisme met l'émotion au premier plan."]],[["Beethoven est devenu sourd.",1,"Il a pourtant continué à composer."],["Chopin a surtout composé pour le piano.",1,"Nocturnes, valses, polonaises, études…"]],[["Mozart est un compositeur du ___ .","classicisme","classicisme"],["Un ___ est un chant avec piano en langue allemande.","lied","lied (pluriel : lieder)"]],""],
["🔁","Les formes musicales","Une œuvre est <b>construite</b> : on répète, on varie, on oppose. <b>Couplet / refrain</b> : les couplets changent, le refrain revient (chansons). Le <b>rondo</b> fait revenir un refrain entre plusieurs couplets (A B A C A). Le <b>canon</b> imite une mélodie en décalé. <b>Thème et variations</b> : un thème est présenté puis transformé.<br>Un <b>riff</b> est un court motif répété (rock, funk) et un <b>ostinato</b> un motif répété en boucle.","Couplet / refrain : le refrain revient|Rondo : A B A C A|Canon : même mélodie décalée|Thème et variations : on transforme un thème|Ostinato / riff : motif répété en boucle","refrain=Partie qui revient entre les couplets;couplet=Partie qui change, avec de nouvelles paroles;rondo=Forme où le refrain revient entre les couplets;variation=Transformation d'un thème;ostinato=Motif répété en boucle;riff=Court motif répété, très utilisé en rock",[["Dans un rondo, le refrain…","ne revient jamais|revient plusieurs fois|est joué une seule fois",1,"Forme A B A C A."],["Un ostinato est…","un motif répété sans cesse|un silence|une nuance",0,"Il crée une pulsation hypnotique."],["La forme « thème et variations » consiste à…","transformer un thème|couper la musique|supprimer le rythme",0,"Le thème revient sous des formes différentes."]],[["Dans une chanson, le refrain reste identique d'une fois à l'autre.",1,"Les couplets, eux, changent de paroles."],["Un canon superpose la même mélodie en décalé.",1,"Exemple : Frère Jacques."]],[["Dans un rondo, le ___ revient plusieurs fois.","refrain","refrain"],["Un motif répété en boucle s'appelle un ___ .","ostinato","ostinato"]],""],
["🎭","Musique et texte : chanson, opéra, comédie musicale","La musique s'associe au texte. La <b>chanson</b> (couplets et refrain) est un genre populaire. L'<b>opéra</b> est une œuvre entièrement chantée : <b>airs</b> (solo), <b>récitatifs</b> (chant proche de la parole), chœurs et orchestre ; le texte est le <b>livret</b>. La <b>comédie musicale</b> mêle chant, danse et dialogues parlés (Broadway). Dans la chanson à texte (Brassens, Brel), les paroles ont un rôle essentiel.","Opéra = œuvre entièrement chantée|Air = solo · récitatif = chant proche de la parole|Comédie musicale = chant + danse + dialogues|Chanson à texte : les paroles comptent beaucoup|Livret = texte d'un opéra","opéra=Œuvre théâtrale entièrement chantée;air=Moment où un personnage chante seul dans un opéra;récitatif=Chant proche de la parole;livret=Texte d'un opéra ou d'une comédie musicale;comédie musicale=Spectacle avec chant, danse et dialogues parlés;parolier=Personne qui écrit les paroles",[["Dans un opéra, tout est…","chanté|parlé|dansé",0,"L'opéra est un théâtre chanté."],["Le livret est…","le texte de l'œuvre|le chef d'orchestre|la partition du violon",0,"Il raconte l'histoire."],["Quel spectacle mélange chant, danse et dialogues parlés ?","la comédie musicale|le récital|la symphonie",0,"Broadway en est la capitale."]],[["Un récitatif est proche de la parole.",1,"Il fait avancer l'histoire."],["Un parolier écrit la musique.",0,"Il écrit les paroles ; le compositeur écrit la musique."]],[["Un spectacle entièrement chanté s'appelle un ___ .","opéra","opéra"],["Le texte d'un opéra s'appelle le ___ .","livret","livret"]],""],
["🎷","Le jazz et le blues","Le <b>blues</b> naît vers 1900 dans le sud des États-Unis, dans les communautés afro-américaines (12 mesures, gamme blues). Le <b>jazz</b> naît à La Nouvelle-Orléans au début du XXe siècle, mêlant blues, ragtime et musiques européennes. Ses marques : l'<b>improvisation</b>, le <b>swing</b> (rythme chaloupé) et le dialogue entre musiciens.<br>Grands noms : Louis Armstrong, Duke Ellington, Ella Fitzgerald, Miles Davis, Django Reinhardt.","Blues : vers 1900, sud des États-Unis, 12 mesures|Jazz : début du XXe siècle, La Nouvelle-Orléans|Improvisation + swing|Instruments : trompette, saxophone, contrebasse, piano, batterie|Armstrong, Ellington, Ella Fitzgerald, Miles Davis","blues=Musique afro-américaine née vers 1900, en 12 mesures;jazz=Musique née à La Nouvelle-Orléans, avec improvisation;improvisation=Inventer la musique en la jouant;swing=Rythme chaloupé caractéristique du jazz;scat=Chant où la voix imite un instrument;big band=Grand orchestre de jazz",[["Dans quelle ville est né le jazz ?","La Nouvelle-Orléans|Paris|Londres",0,"Dans le sud des États-Unis."],["Improviser, c'est…","inventer en jouant|lire une partition|chanter en chœur",0,"Une caractéristique majeure du jazz."],["Qui était un grand trompettiste de jazz ?","Louis Armstrong|Chopin|Brassens",0,"Surnommé « Satchmo »."]],[["Le blues est apparu avant le rock'n'roll.",1,"Blues vers 1900, rock'n'roll dans les années 1950."],["Django Reinhardt est un guitariste de jazz manouche.",1,"Il a fondé le Quintette du Hot Club de France."]],[["Inventer la musique en la jouant, c'est ___ .","improviser|improvisation","improviser"],["Le rythme chaloupé du jazz s'appelle le ___ .","swing","swing"]],""],
["🎬","Musique à programme et musique de film","La <b>musique à programme</b> raconte une histoire ou décrit un paysage : <i>Les Tableaux d'une exposition</i> (Moussorgski), <i>Le Carnaval des animaux</i> (Saint-Saëns), la <i>Symphonie fantastique</i> (Berlioz). Au cinéma, la <b>musique de film</b> souligne l'émotion et l'action : John Williams, Ennio Morricone, Hans Zimmer, Michel Legrand.<br>Un <b>leitmotiv</b> est un thème lié à un personnage ou une idée. La <b>bande originale</b> (BO) réunit les musiques d'un film.","Musique à programme = raconte une histoire|Leitmotiv = thème lié à un personnage|BO = bande originale d'un film|Williams, Morricone, Zimmer, Legrand|Berlioz, Saint-Saëns, Moussorgski","leitmotiv=Thème musical lié à un personnage;bande originale=Ensemble des musiques d'un film;musique à programme=Musique qui raconte une histoire;compositeur=Personne qui écrit la musique;thème=Court motif musical principal;orchestration=Choix des instruments pour jouer une œuvre",[["« Le Carnaval des animaux » est de…","Saint-Saëns|Mozart|Brel",0,"Camille Saint-Saëns (1886)."],["Un leitmotiv est…","un thème lié à un personnage|un instrument de percussion|un type de voix",0,"Très utilisé par Wagner et au cinéma."],["BO signifie…","bande originale|basse orchestrale|bruit ordinaire",0,"Les musiques composées pour un film."]],[["John Williams a composé la musique de Star Wars.",1,"Il a aussi composé Indiana Jones et Harry Potter."],["Un film n'a jamais de musique composée spécialement pour lui.",0,"La bande originale est souvent composée pour le film."]],[["La ___ originale réunit les musiques d'un film.","bande","bande originale"],["Un thème associé à un personnage s'appelle un ___ .","leitmotiv","leitmotiv"]],""]

["🌀","La musique du XXe siècle","Au XXe siècle, les compositeurs cherchent de nouveaux langages. <b>Debussy</b> et <b>Ravel</b> (<b>impressionnisme</b>) jouent sur les timbres et les atmosphères. <b>Stravinsky</b> (<i>Le Sacre du printemps</i>, 1913) bouscule le rythme. <b>Schönberg</b> invente le <b>dodécaphonisme</b> (12 sons).<br>Avec la <b>musique concrète</b> (Pierre Schaeffer, 1948) on compose avec des bruits enregistrés. Le <b>minimalisme</b> (Steve Reich, Philip Glass) répète de petits motifs.","Impressionnisme : Debussy, Ravel (timbres, atmosphères)|Stravinsky : Le Sacre du printemps (1913)|Schönberg : dodécaphonisme (12 sons)|Schaeffer : musique concrète (bruits enregistrés)|Reich, Glass : minimalisme (répétition)","impressionnisme=Style de Debussy basé sur les atmosphères;dodécaphonisme=Méthode qui utilise les 12 sons de façon égale;musique concrète=Musique faite avec des bruits enregistrés;minimalisme=Style fondé sur la répétition de petits motifs;contemporain=Musique écrite de nos jours;timbre=La couleur d'un son",[["Qui a composé « Le Sacre du printemps » ?","Stravinsky|Debussy|Chopin",0,"Création scandaleuse à Paris en 1913."],["L'impressionnisme musical est lié à…","Debussy|Mozart|Bach",0,"Il privilégie les ambiances et les timbres."],["La musique concrète utilise…","des bruits enregistrés|uniquement des violons|des chœurs",0,"Inventée par Pierre Schaeffer."]],[["Le minimalisme repose sur la répétition de petits motifs.",1,"Steve Reich, Philip Glass."],["Ravel est un compositeur baroque.",0,"C'est un compositeur français du XXe siècle (Boléro, 1928)."]],[["Le « Boléro » est une œuvre de ___ .","Ravel","Maurice Ravel (1928)"],["La musique ___ est composée à partir de bruits enregistrés.","concrète","concrète"]],""],
["🎸","Rock, pop, rap, électro : les musiques actuelles","Les <b>musiques actuelles</b> se diffusent grâce à la radio, aux disques puis au numérique. Le <b>rock'n'roll</b> naît dans les années 1950 (Elvis, Chuck Berry) et devient le <b>rock</b> (Beatles, Rolling Stones). Le <b>reggae</b> vient de Jamaïque (Bob Marley). Le <b>rap</b> et le <b>hip-hop</b> naissent dans le Bronx (New York) dans les années 1970 : texte scandé sur un <b>beat</b>, DJ, samples. L'<b>électro</b> (house, techno) est faite avec des machines (Kraftwerk, Daft Punk).","Rock'n'roll : années 1950 (Elvis, Chuck Berry)|Reggae : Jamaïque (Bob Marley)|Rap / hip-hop : Bronx, années 1970|Électro : machines (Daft Punk, Kraftwerk)|Rock : guitare électrique, basse, batterie","rock=Style à guitares électriques, basse et batterie;rap=Texte scandé sur un rythme (beat);reggae=Musique jamaïcaine au rythme décalé;électro=Musique créée avec des machines;sample=Court extrait sonore réutilisé dans un morceau;DJ=Personne qui mixe des morceaux",[["Le reggae vient de…","Jamaïque|France|Japon",0,"Bob Marley en est la figure majeure."],["Un sample, c'est…","un extrait sonore réutilisé|un type de voix|un instrument à cordes",0,"Très utilisé en rap et en électro."],["Quel groupe est britannique ?","The Beatles|Les Ramones|Nirvana",0,"Les Beatles viennent de Liverpool."]],[["Le rap est né dans le Bronx, à New York.",1,"Dans les années 1970."],["Le rock'n'roll est apparu dans les années 1990.",0,"Il est apparu dans les années 1950."]],[["Le ___ est une musique jamaïcaine popularisée par Bob Marley.","reggae","reggae"],["Dans le rap, le rythme de base s'appelle le ___ .","beat","beat"]],""],
["💻","Musique et technologie","La technologie a transformé la musique. L'<b>enregistrement</b> (phonographe d'Edison, 1877) conserve le son ; le <b>micro</b> le capte ; l'amplificateur et les enceintes le diffusent. Le <b>synthétiseur</b> crée des sons électroniques. Avec la <b>MAO</b> (musique assistée par ordinateur) on compose, enregistre et <b>mixe</b> sur ordinateur. Le <b>MIDI</b> est un langage qui transmet les notes entre instruments et ordinateur. Le <b>streaming</b> permet d'écouter en ligne.","Edison : phonographe (1877)|Micro capte · enceinte diffuse|MAO = musique assistée par ordinateur|MIDI = langage de communication des instruments|Streaming = écoute en ligne","enregistrement=Conserver un son pour le réécouter;micro=Appareil qui capte le son;MAO=Composer avec un ordinateur;MIDI=Langage qui transmet les notes entre instruments;mixage=Régler et assembler les pistes d'un morceau;streaming=Écouter de la musique en ligne",[["Qui a inventé le phonographe ?","Edison|Mozart|Daft Punk",0,"En 1877."],["MAO signifie…","musique assistée par ordinateur|mélodie à l'orgue|mixage à l'oreille",0,"On crée la musique avec un logiciel."],["Le mixage consiste à…","régler et assembler les pistes|inventer un instrument|écrire une partition",0,"Régler volumes, effets, équilibre."]],[["Le micro diffuse le son dans la salle.",0,"Le micro capte ; l'enceinte diffuse."],["Le MIDI transmet des notes, pas des sons enregistrés.",1,"Il décrit quelles notes jouer."]],[["Un appareil qui capte le son s'appelle un ___ .","micro|microphone","micro (microphone)"],["Le ___ est un langage qui transmet les notes entre instruments et ordinateur.","MIDI","MIDI"]],""],
["✊","Musique, société et engagement","La musique accompagne les grands moments de la société. Les <b>hymnes</b> (La Marseillaise) rassemblent une nation. Des artistes s'engagent par la chanson : Bob Dylan, Bob Marley, Nina Simone, Renaud… Elle peut dénoncer, revendiquer, unir (concerts caritatifs comme <i>Live Aid</i>).<br>Le <b>droit d'auteur</b> protège les créateurs (la SACEM collecte et reverse des droits). La <b>Fête de la musique</b> a lieu le 21 juin depuis 1982.","Hymne : chant d'un pays (La Marseillaise)|Chanson engagée : défendre des idées|Droit d'auteur : protège les créateurs (SACEM)|Fête de la musique : 21 juin, depuis 1982|La musique crée du lien","hymne=Chant officiel d'un pays;chanson engagée=Chanson qui défend une cause;droit d'auteur=Protège les créateurs de musique;SACEM=Société française qui gère les droits des auteurs;festival=Événement musical de plusieurs concerts;concert=Spectacle où des musiciens jouent devant un public",[["La Fête de la musique a lieu le…","21 juin|14 juillet|1er mai",0,"Depuis 1982."],["La Marseillaise est…","l'hymne national français|une comédie musicale|un opéra de Mozart",0,"Écrite en 1792 par Rouget de Lisle."],["Le droit d'auteur sert à…","protéger les créateurs|interdire d'écouter de la musique|vendre des instruments",0,"Les auteurs sont rémunérés quand leurs œuvres sont diffusées."]],[["La Fête de la musique est née en France.",1,"Créée en 1982."],["Une chanson engagée ne parle jamais de société.",0,"Elle défend justement une cause."]],[["La Marseillaise est l'___ national français.","hymne","hymne"],["La Fête de la musique a lieu le 21 ___ .","juin","21 juin"]],""],
["🎤","Les métiers de la musique et la scène","Faire de la musique, c'est aussi un monde de métiers. Sur scène : l'<b>interprète</b> (chanteur, instrumentiste), le <b>chef d'orchestre</b>. Derrière la musique : le <b>compositeur</b>, l'<b>arrangeur</b>, le <b>parolier</b>. Dans l'ombre : l'<b>ingénieur du son</b>, le <b>régisseur</b>, le <b>producteur</b>, le <b>luthier</b> (il fabrique et répare les instruments à cordes).<br>On se forme au <b>conservatoire</b>, en école de musique, à l'université ou en école spécialisée.","Interprète joue ou chante · compositeur crée|Arrangeur réécrit une musique pour d'autres instruments|Ingénieur du son : captation et mixage|Luthier : fabrique et répare les instruments|Conservatoire = école de musique","interprète=Musicien ou chanteur qui joue une œuvre;compositeur=Personne qui crée la musique;arrangeur=Réécrit une musique pour d'autres instruments;luthier=Fabrique et répare des instruments;ingénieur du son=Capte et règle le son d'un concert;conservatoire=École publique de musique",[["Qui fabrique et répare les violons ?","un luthier|un parolier|un régisseur",0,"Le luthier travaille le bois."],["Un arrangeur…","réécrit une musique pour d'autres instruments|dirige l'orchestre|écrit les paroles",0,"Il adapte les œuvres."],["L'ingénieur du son s'occupe…","du son (captation, mixage)|des costumes|des affiches",0,"Il règle le rendu sonore."]],[["Un compositeur crée la musique.",1,"Il écrit les notes et les structures."],["Le conservatoire est un lieu de formation musicale.",1,"Il en existe dans toute la France."]],[["Celui qui fabrique des violons est un ___ .","luthier","luthier"],["Le chanteur ou l'instrumentiste qui joue une œuvre est un ___ .","interprète","interprète"]],""]

function voice(m,timb){

  let sus=true;
  if(timb=="piano"){mk("triangle",f,1);mk("sine",f*2,.35);mk("sine",f*3,.12);sus=false}
  else if(timb=="orgue"){mk("sine",f,1);mk("sine",f*2,.5);mk("sine",f*4,.25)}
  else if(timb=="synthé"){mk("sawtooth",f,.5);mk("square",f*1.005,.25)}

}

function gen(l,i){

    const o1=sh([d,...sh(o).slice(0,2).map(p=>p[1])]);out.push({t:"q",q:"Quelle est la définition de « "+t+" » ?",o:o1,a:o1.indexOf(d)});

  });

const shp=s=>s.split(";").map(x=>{x=x.trim();const t=x[0],v=x.slice(1).trim(),q=v.split(/\s+/);
  if(t=="c")return`<circle cx="${q[0]}" cy="${q[1]}" r="${q[2]}"/>`;
  if(t=="e")return`<ellipse cx="${q[0]}" cy="${q[1]}" rx="${q[2]}" ry="${q[3]}"${q[4]?` transform="rotate(${q[4]} ${q[0]} ${q[1]})"`:""}/>`;
  if(t=="r")return`<rect x="${q[0]}" y="${q[1]}" width="${q[2]}" height="${q[3]}" rx="${q[4]||0}"/>`;
  if(t=="g")return`<polygon points="${v}"/>`;
  if(t=="s"){const[cx,cy,r]=q.map(Number);return`<polygon points="${Array.from({length:10},(_,i)=>{const a=-Math.PI/2+i*Math.PI/5,d=i%2?r*.45:r;return(cx+d*Math.cos(a)).toFixed(1)+","+(cy+d*Math.sin(a)).toFixed(1)}).join(" ")}"/>`}
  return`<path d="${v}"/>`}).join("");
function coloList(){
  nav(games,"games");app.append(h2("🎨 Coloriages magiques"),H(`<small class="tr">Chaque numéro correspond à une couleur. Colorie toutes les zones pour faire apparaître le dessin : +15 🎵 la première fois que tu termines un coloriage !</small>`));
  const g=H("","grid");
  COLO.forEach((c,i)=>{const n=(S.cz[c[0]]||[]).length,b=H(`${c[1]} ${c[2]}<small>${S.col[c[0]]&&n==c[4].length?"✔ terminé":n?n+" / "+c[4].length+" zones":c[4].length+" zones à colorier"}</small>`,"btn lv"),[c1,c2]=cam(268,i%4,4,42,60);
    b.style.setProperty("--c",c1);b.style.setProperty("--c2",c2);b.style.fontSize="1.15rem";b.onclick=()=>colo(i);g.append(b)});
  app.append(g);
}
function colo(ix){
  const c=COLO[ix],id=c[0],pal=[...c[3]].map(k=>CC[k]),Z=c[4];nav(coloList,"games");
  let cur=0;const fill=new Set(S.cz[id]||[]);
  app.append(h2(c[1]+" "+c[2]));
  const card=H(`<svg viewBox="0 0 300 300" role="img" aria-label="Coloriage : ${c[2]}">${Z.map((z,i)=>`<g class="cz" data-i="${i}">${shp(z[1])}</g>`).join("")}<g class="cd">${c[5]}</g>${Z.map(z=>`<text class="cn" x="${z[2]}" y="${z[3]}">${z[0]}</text>`).join("")}</svg>`,"card colo"),pl=H("","pal"),msg=H("","msg");
  const gs=[...card.querySelectorAll(".cz")],ts=[...card.querySelectorAll(".cn")];
  const paint=i=>{gs[i].style.fill=pal[Z[i][0]-1][1];gs[i].classList.add("ok");ts[i].style.display="none"};
  const left=n=>Z.filter((z,i)=>z[0]==n+1&&!fill.has(i)).length;
  const drawPal=()=>{pl.innerHTML="";pal.forEach((p,n)=>{const b=document.createElement("button");b.className="pc"+(n==cur?" on":"");b.innerHTML=`<i style="background:${p[1]}">${left(n)?n+1:"✔"}</i><small>${p[0]}</small>`;b.onclick=()=>{cur=n;drawPal()};pl.append(b)})};
  const fin=first=>{msg.className="msg ok";msg.textContent="🎉 Coloriage terminé !"+(first?" +15 🎵":"")};
  gs.forEach((g,i)=>{if(fill.has(i))paint(i);g.onclick=()=>{if(fill.has(i))return;
    if(Z[i][0]!=cur+1){msg.className="msg ko";msg.textContent="Cette zone porte le numéro "+Z[i][0]+" : choisis la couleur « "+pal[Z[i][0]-1][0]+" ».";g.classList.add("no");setTimeout(()=>g.classList.remove("no"),400);return}
    fill.add(i);S.cz[id]=[...fill];save();paint(i);msg.textContent="";
    if(!left(cur)){const nx=pal.findIndex((_,n)=>left(n));if(nx>=0)cur=nx}drawPal();
    if(fill.size==Z.length){const first=!S.col[id];S.col[id]=1;save();if(first)addPts(15);fin(first)}}});
  drawPal();if(fill.size==Z.length)fin(false);
  app.append(card,H(`<small class="tr">Choisis une couleur, puis touche les zones qui portent son numéro.</small>`),pl,msg,B("🔄 Recommencer ce coloriage","btn main alt",()=>{if(confirm("Effacer ce coloriage et recommencer ?")){delete S.cz[id];save();colo(ix)}}));
}

const PSEUDO=/^eleve(0[1-9]|[1-4][0-9]|50)$/;
const CK=s=>{let h=5381;for(const ch of s+"|MusicAll")h=((h*33)^ch.charCodeAt(0))>>>0;return h.toString(36)};
const today=()=>{const d=new Date(),z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};

function bilanCode(){
  const p=[UID,today(),S.stage,S.pts,S.tot||0,S.min||0,S.nx||0,Object.keys(S.seen).length,Object.keys(S.col).length,Object.keys(S.mel).length,TID.map(k=>S.best[k]!=null?S.best[k]:"-").join(""),TID.map(k=>S.done[k]?1:0).join("")].join("|");
  return"MA1."+btoa(p).replace(/=+$/,"")+"."+CK(p);
}
function ident(){
  nav(home,"home");app.append(h2("👤 Identification"));
  if(UID){const c=H(`<div class="em">👤</div><h3>${UID}</h3><p>Ta progression est enregistrée sous ce pseudo sur cet appareil.</p>`,"card big");
    c.append(B("📊 Voir mon bilan","btn main",bilan),B("🚪 Changer d'élève","btn main alt",()=>{if(confirm("Quitter le pseudo "+UID+" ? Sa progression reste enregistrée sur cet appareil."))try{localStorage.removeItem("musicall1:id");location.reload()}catch(e){}}));app.append(c);return}
  const c=H(`<div class="em">👤</div><h3>Qui es-tu ?</h3><p>Écris le pseudo donné par ton professeur (exemple : <b>eleve07</b>). Il sert à retrouver ta progression et à préparer ton bilan.</p>`,"card big"),i=document.createElement("input"),msg=H("","msg");
  i.type="text";i.placeholder="eleve…";i.autocapitalize="off";i.autocomplete="off";i.spellcheck=false;i.maxLength=12;
  const go=()=>{const p=plain(i.value);if(!PSEUDO.test(p)){msg.className="msg ko";msg.textContent="Ce pseudo n'existe pas. Vérifie-le ou demande-le à ton professeur.";return}
    try{const k="musicall1:"+p;
      if(!localStorage.getItem(k)&&(S.pts||S.stage||Object.keys(S.done).length)&&confirm("Il y a déjà une progression sur cet appareil.\n\nOK : c'est la mienne, je la garde pour "+p+".\nAnnuler : je commence à zéro.")){localStorage.setItem(k,JSON.stringify(S));localStorage.removeItem("musicall1")}
      localStorage.setItem("musicall1:id",p);location.reload()}catch(e){msg.className="msg ko";msg.textContent="Impossible d'enregistrer sur cet appareil."}};
  i.onkeydown=k=>{if(k.key=="Enter")go()};c.append(i,B("Valider","btn main",go),msg);
  app.append(c,H(`<small class="tr">Sans pseudo, tu peux quand même utiliser toute l'application.</small>`));
}
function bilan(){
  nav(UID?ident:home,"home");app.append(h2("📊 Mon bilan"));

  app.append(H(`<h3>👤 ${UID||"Élève non identifié"}</h3><small class="tr">Bilan du ${today().split("-").reverse().join("/")}</small>
<div class="stats"><div><b>${S.stage+1}</b><small>étape du parcours (${GR[Math.min(5,Math.floor(S.stage/3))]})</small></div><div><b>${tot} / ${ALL.length}</b><small>thèmes réussis</small></div><div><b>${S.tot||0} 🎵</b><small>gagnées en tout</small></div><div><b>${hm(S.min||0)}</b><small>sur l'application</small></div><div><b>${S.nx||0}</b><small>séries d'exercices terminées</small></div><div><b>${Object.keys(S.seen).length}</b><small>fiches d'artistes lues</small></div><div><b>${Object.keys(S.col).length} / ${COLO.length}</b><small>coloriages terminés</small></div></div>`,"card"));
  LV.forEach((n,l)=>{const c=H(`<h3>${n} · ${nd(l)} / ${D[l].length} thèmes réussis</h3><div class="bar"><i style="width:${nd(l)/D[l].length*100}%"></i></div>`,"card");
    D[l].forEach((a,i)=>{const id=l+"-"+i;c.append(H(`${S.done[id]?"✅":S.best[id]!=null?"🟠":"⚪"} ${a[1]}<small>${S.best[id]!=null?"meilleur score : "+S.best[id]+" / 8":"pas encore essayé"}</small>`,"bl"))});app.append(c)});
  if(!UID){const c=H("<h3>👤 Identifie-toi</h3><p>Pour envoyer ton bilan à ton professeur, indique d'abord ton pseudo.</p>","card");c.append(B("👤 Identification","btn main",ident));app.append(c);return}
  const code=bilanCode(),c=H(`<h3>📤 Envoyer mon bilan</h3><p>Ce code contient ton bilan d'aujourd'hui. Copie-le et envoie-le à ton professeur, comme il te l'a demandé.</p>`,"card"),ta=document.createElement("textarea"),msg=H("","msg");
  ta.readOnly=true;ta.value=code;ta.rows=4;ta.className="code";ta.onfocus=()=>ta.select();
  const ok=()=>{msg.className="msg ok";msg.textContent="✅ Code copié !"},old=()=>{ta.select();try{document.execCommand("copy");ok()}catch(e){}};
  c.append(ta,B("📋 Copier mon code","btn main",()=>{try{navigator.clipboard.writeText(code).then(ok,old)}catch(e){old()}}));
  if(navigator.share)c.append(B("📤 Partager","btn main alt",()=>{navigator.share({title:"Bilan Music’All "+UID,text:"Bilan Music’All de "+UID+" :\n"+code}).catch(()=>{})}));
  c.append(B("💾 Télécharger le fichier","btn main alt",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([code+"\n"],{type:"text/plain"}));a.download="bilan-"+UID+"-"+today()+".txt";document.body.append(a);a.click();a.remove()}),msg);
  app.append(c);
}
